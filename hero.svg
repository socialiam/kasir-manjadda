<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gambar latar sampul katalog: rak toko pecah belah, digambar sendiri.
  Garis putih tipis di atas latar bening, supaya warna sampul tetap
  terlihat menembus dan tulisan di atasnya tetap terbaca.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
     opacity="0.19">

    <!-- papan rak -->
    <path d="M40 200h1120M40 350h1120M40 480h1120"/>
    <path d="M110 200v150M1090 200v150M110 350v130M1090 350v130"/>

    <!-- ===== rak atas ===== -->
    <!-- tumpukan piring -->
    <ellipse cx="215" cy="150" rx="70" ry="15"/>
    <ellipse cx="215" cy="172" rx="80" ry="16"/>
    <ellipse cx="215" cy="196" rx="90" ry="17"/>

    <!-- teko -->
