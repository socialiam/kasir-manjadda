<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layar Pelanggan</title>
<meta name="theme-color" content="#070b16">
<link rel="icon" href="ikon-192.png">
<link rel="stylesheet" href="style.css">
<style>
/* Layar ini menghadap pembeli: hurufnya besar, warnanya gelap supaya tidak
   menyilaukan, dan tidak ada satu pun tombol yang bisa ditekan pembeli. */
body{ background:#070b16; color:#eef2ff; overflow:hidden; }
.papan{ display:flex; flex-direction:column; height:100vh; max-width:1100px; margin:0 auto; padding:18px 22px; }

.kop{ display:flex; justify-content:space-between; align-items:center; gap:14px;
  padding-bottom:14px; border-bottom:1px solid #1e2a45; }
.kop .nama{ font-size:26px; font-weight:800; letter-spacing:-.02em; }
.kop .jenis{ font-size:14px; color:#93a3bd; }
.kop .kasir{ font-size:14px; color:#93a3bd; text-align:right; }

.isi-papan{ flex:1; display:flex; flex-direction:column; min-height:0; padding-top:14px; }

/* --- daftar belanja --- */
.daftar{ flex:1; overflow:auto; }
.baris-item{ display:flex; align-items:center; gap:16px; padding:13px 4px; border-bottom:1px solid #16203a; }
.baris-item:last-child{ border-bottom:none; }
.baris-item .ikon-barang{ width:46px; height:46px; color:#818cf8; }
.baris-item .nama{ flex:1; font-size:21px; font-weight:700; min-width:0; }
.baris-item .hitungan{ font-size:16px; color:#93a3bd; white-space:nowrap; }
.baris-item .jumlah-rp{ font-size:22px; font-weight:800; min-width:150px; text-align:right;
  font-variant-numeric:tabular-nums; }
.baris-item.baru{ animation:sorot 1.1s ease; }
@keyframes sorot{ from{ background:#1e293b; } to{ background:transparent; } }

/* --- kaki: total dan kembalian --- */
.kaki{ border-top:2px solid #1e2a45; padding-top:14px; margin-top:6px; }
.baris-kaki{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:5px 0;
  font-size:19px; color:#b9c4d9; }
.baris-kaki b{ font-variant-numeric:tabular-nums; color:#eef2ff; }
.total-besar{ display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  padding:12px 0 4px; }
.total-besar span{ font-size:26px; font-weight:800; letter-spacing:.02em; }
.total-besar b{ font-size:clamp(40px, 7vw, 72px); font-weight:800; letter-spacing:-.03em;
  color:#4ade80; font-variant-numeric:tabular-nums; line-height:1.05; }

.kotak-kembalian{ margin-top:12px; background:linear-gradient(135deg,#14532d,#166534);
  border:1px solid #22c55e55; border-radius:18px; padding:16px 22px;
  display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.kotak-kembalian span{ font-size:22px; font-weight:800; color:#bbf7d0; }
.kotak-kembalian b{ font-size:clamp(34px, 6vw, 60px); font-weight:800; color:#fff;
  font-variant-numeric:tabular-nums; }
.kotak-kembalian.kurang{ background:linear-gradient(135deg,#4c0519,#7f1d1d); border-color:#f43f5e55; }

/* --- layar sambutan dan terima kasih --- */
.tengah-layar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:10px; }
.lambang{ width:108px; height:108px; border-radius:30px; display:grid; place-items:center;
  font-size:44px; font-weight:800; color:#fff; margin-bottom:8px;
  background:linear-gradient(145deg,#4f46e5,#8b5cf6); box-shadow:0 22px 50px -18px #4f46e5; }
.tengah-layar h1{ font-size:clamp(28px, 4.4vw, 46px); letter-spacing:-.02em; }
.tengah-layar p{ color:#93a3bd; font-size:19px; }
.centang{ width:112px; height:112px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(145deg,#16a34a,#059669); box-shadow:0 22px 50px -18px #16a34a;
  margin-bottom:6px; }
.centang svg{ width:58px; height:58px; stroke:#fff; fill:none; stroke-width:3.4;
  stroke-linecap:round; stroke-linejoin:round; }

/* --- papan iklan saat menganggur --- */
.papan-iklan{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:6px; padding:10px 0;
}
.papan-iklan h1{ font-size:clamp(26px,4.2vw,44px); letter-spacing:-.02em; line-height:1.15; }
.jenis-papan{ color:#93a3bd; font-size:17px; }
.slogan-papan{ color:#c7d2fe; font-size:16px; font-style:italic; margin-top:6px; max-width:36ch; }
.keping-papan{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
.keping-papan span{
  background:#16203a; border:1px solid #223054; border-radius:999px;
  padding:7px 15px; font-size:13.5px; color:#b9c4d9; font-weight:600;
}
.promo-papan{
  margin-top:26px; padding:18px 26px; border-radius:18px; max-width:44ch;
  background:linear-gradient(135deg,#4f46e5,#7c3aed); box-shadow:0 18px 40px -20px #4f46e5;
  animation:muncul-promo .5s ease;
}
.promo-papan b{ display:block; font-size:19px; font-weight:800; }
.promo-papan span{ display:block; font-size:14px; opacity:.92; margin-top:5px; line-height:1.5; }
@keyframes muncul-promo{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }

.kaki-papan{ display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  justify-content:center; margin-top:28px; }
.jam-papan{ font-size:15px; color:#93a3bd; font-weight:600; }
.tanda-hubung{ display:inline-flex; align-items:center; gap:7px; font-size:13px; color:#64748b; }
.tanda-hubung i{ width:8px; height:8px; border-radius:50%; background:#64748b; display:block; }
.tanda-hubung.hidup{ color:#4ade80; }
.tanda-hubung.hidup i{ background:#4ade80; animation:denyut-hubung 2s ease-out infinite; }
@keyframes denyut-hubung{
  0%{ box-shadow:0 0 0 0 rgba(74,222,128,.6) }
  70%{ box-shadow:0 0 0 8px rgba(74,222,128,0) }
  100%{ box-shadow:0 0 0 0 rgba(74,222,128,0) }
}
.petunjuk-papan{ margin-top:16px; font-size:13px; color:#64748b; max-width:44ch; line-height:1.6; }

.jejak{ text-align:center; color:#64748b; font-size:12.5px; padding-top:10px; }
@media (max-width:640px){
  .papan{ padding:12px 14px; }
  .baris-item .nama{ font-size:17px; }
  .baris-item .ikon-barang{ width:36px; height:36px; }
  .baris-item .jumlah-rp{ font-size:18px; min-width:110px; }
}
</style>
</head>
<body>

<div class="papan">
  <div class="kop">
    <div>
      <div class="nama" id="p-nama-toko">Toko</div>
      <div class="jenis" id="p-jenis-toko"></div>
    </div>
    <div class="kasir" id="p-kasir"></div>
  </div>
  <div class="isi-papan" id="p-isi"></div>
  <div class="jejak">Layar ini hanya menampilkan. Pembayaran tetap dilakukan di kasir.</div>
</div>

<script src="ikon-barang.js"></script>
<script>
'use strict';
const SALURAN = 'kasirManjadda.pelanggan';
const angka = new Intl.NumberFormat('id-ID');
const rupiah = n => 'Rp ' + angka.format(Math.round(Number(n) || 0));
const aman = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inisial(nama) {
  const kata = String(nama || '?').trim().split(/\s+/);
  return ((kata[0]?.[0] || '') + (kata[1]?.[0] || '')).toUpperCase() || '?';
}

let jumlahItemSebelumnya = 0;

function tampilkan(data) {
  if (!data) return;
  const toko = data.toko || {};
  document.getElementById('p-nama-toko').textContent = toko.nama || 'Toko';
  document.getElementById('p-jenis-toko').textContent = toko.jenis || '';
  document.getElementById('p-kasir').textContent = data.petugas ? 'Kasir: ' + data.petugas : '';
  document.title = 'Layar Pelanggan - ' + (toko.nama || 'Toko');

  const isi = document.getElementById('p-isi');

  if (data.status === 'selesai') {
    isi.innerHTML = `
      <div class="tengah-layar">
        <div class="centang"><svg viewBox="0 0 24 24"><path d="m4 12.5 5.5 5.5L20 7"/></svg></div>
        <h1>Terima kasih</h1>
        <p>${aman(toko.catatanStruk || 'Selamat berbelanja kembali')}</p>
        <div style="width:100%;max-width:620px;margin-top:18px">
          <div class="baris-kaki"><span>Total belanja</span><b>${rupiah(data.total)}</b></div>
          <div class="baris-kaki"><span>Uang diterima</span><b>${rupiah(data.bayar)}</b></div>
          <div class="kotak-kembalian"><span>KEMBALIAN</span><b>${rupiah(data.kembalian)}</b></div>
          <p style="margin-top:12px;font-size:13px;color:#64748b">Nota ${aman(data.nomor || '')}</p>
        </div>
      </div>`;
    jumlahItemSebelumnya = 0;
    return;
  }

  const item = data.item || [];
  if (!item.length) {
    gambarPapanIklan(toko, pernahTerima);
    jumlahItemSebelumnya = 0;
    return;
  }
  hentikanPapanIklan();

  const barisBaru = item.length > jumlahItemSebelumnya;
  jumlahItemSebelumnya = item.length;

  isi.innerHTML = `
    <div class="daftar">${item.map((i, urut) => `
      <div class="baris-item ${barisBaru && urut === item.length - 1 ? 'baru' : ''}">
        ${ikonBarang(i)}
        <span class="nama">${aman(i.nama)}</span>
        <span class="hitungan">${angka.format(i.jumlah)} &times; ${angka.format(i.hargaJual)}</span>
        <span class="jumlah-rp">${angka.format(i.jumlah * i.hargaJual)}</span>
      </div>`).join('')}
    </div>
    <div class="kaki">
      ${data.diskon ? `<div class="baris-kaki"><span>Subtotal</span><b>${rupiah(data.subtotal)}</b></div>
        <div class="baris-kaki"><span>Diskon</span><b>- ${rupiah(data.diskon)}</b></div>` : ''}
      <div class="total-besar"><span>TOTAL</span><b>${rupiah(data.total)}</b></div>
      ${data.bayar ? `<div class="baris-kaki"><span>Uang diterima</span><b>${rupiah(data.bayar)}</b></div>
        <div class="kotak-kembalian ${data.kembalian < 0 ? 'kurang' : ''}">
          <span>${data.kembalian < 0 ? 'KURANG' : 'KEMBALIAN'}</span>
          <b>${rupiah(Math.abs(data.kembalian))}</b></div>` : ''}
    </div>`;

  // daftar panjang selalu memperlihatkan barang terakhir yang dipindai
  const daftar = isi.querySelector('.daftar');
  if (daftar) daftar.scrollTop = daftar.scrollHeight;
}

/* ---------- papan iklan saat menganggur ----------
   Layar yang menghadap pembeli tidak boleh terlihat mati. Selama kasir belum
   memindai apa pun, layar ini memajang jati diri toko, jam, dan promo yang
   berganti sendiri, sehingga waktu menganggur pun tetap bekerja. */

let jamPapan = null;
let promoPapan = 0;

function hentikanPapanIklan() {
  clearInterval(jamPapan);
  jamPapan = null;
}

function gambarPapanIklan(toko, terhubung) {
  const promo = Array.isArray(toko.promo) ? toko.promo.filter(p => p && p.judul) : [];
  const keping = [];
  if (toko.jamBuka) keping.push('Buka ' + aman(toko.jamBuka));
  if (toko.alamat) keping.push(aman(toko.alamat));
  if (toko.telepon) keping.push(aman(toko.telepon));

  document.getElementById('p-isi').innerHTML = `
    <div class="papan-iklan">
      <div class="lambang">${aman(inisial(toko.nama || 'Toko'))}</div>
      <h1>${aman(toko.nama || 'Selamat datang')}</h1>
      ${toko.jenis ? `<p class="jenis-papan">${aman(toko.jenis)}</p>` : ''}
      ${toko.slogan ? `<p class="slogan-papan">${aman(toko.slogan)}</p>` : ''}
      ${keping.length ? `<div class="keping-papan">${keping.map(k => `<span>${k}</span>`).join('')}</div>` : ''}
      ${promo.length ? `<div class="promo-papan" id="promo-papan"></div>` : ''}
      <div class="kaki-papan">
        <span class="jam-papan" id="jam-papan"></span>
        <span class="tanda-hubung ${terhubung ? 'hidup' : ''}">
          <i></i>${terhubung ? 'Terhubung dengan kasir' : 'Menunggu kiriman dari kasir'}
        </span>
      </div>
      ${terhubung ? '' : `<p class="petunjuk-papan">Buka layar ini lewat tombol
        <b>Tampilan Pelanggan</b> di aplikasi kasir, pada perangkat yang sama.</p>`}
    </div>`;

  const perbarui = () => {
    const jam = document.getElementById('jam-papan');
    if (jam) {
      jam.textContent = new Date().toLocaleTimeString('id-ID',
        { hour: '2-digit', minute: '2-digit' }) + ' · ' +
        new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    const kotak = document.getElementById('promo-papan');
    if (kotak && promo.length) {
      const p = promo[promoPapan % promo.length];
      kotak.innerHTML = `<b>${aman(p.judul)}</b><span>${aman(p.teks || '')}</span>`;
    }
  };
  perbarui();
  hentikanPapanIklan();
  let detik = 0;
  jamPapan = setInterval(() => {
    detik += 1;
    if (promo.length > 1 && detik % 7 === 0) promoPapan += 1;   // promo berganti tiap tujuh detik
    perbarui();
  }, 1000);
}

/* Dua jalur penerimaan: siaran seketika, dan simpanan browser sebagai cadangan
   sekaligus pengisi layar saat halaman ini baru dibuka. */
let pernahTerima = false;
function terima(data) {
  pernahTerima = true;
  tampilkan(data);
}

try {
  const saluran = new BroadcastChannel(SALURAN);
  saluran.onmessage = e => terima(e.data);
} catch (e) { /* browser lama: cukup pakai jalur simpanan */ }

window.addEventListener('storage', e => {
  if (e.key === SALURAN && e.newValue) {
    try { terima(JSON.parse(e.newValue)); } catch (err) { /* abaikan */ }
  }
});

try {
  const awal = localStorage.getItem(SALURAN);
  if (awal) terima(JSON.parse(awal));
  else tampilkan({ status: 'kosong', toko: {}, item: [] });
} catch (e) {
  tampilkan({ status: 'kosong', toko: {}, item: [] });
}
</script>
</body>
</html>
