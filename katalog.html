<meta property="og:description" content="Gelas, piring, panci, ember, lemari plastik. Harga lusinan. Bisa antar ke Kubu, Duri, Pinggir, Kandis, Ujung Tanjung, dan Dumai. Pesan lewat WhatsApp.">

<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="stylesheet" href="style.css">
<style>
/* ============================================================
   KATALOG PELANGGAN
   Halaman ini milik pembeli. Yang tampil hanya yang mereka perlukan:
   nama barang, gambar, harga jual, dan ketersediaan. Tidak ada harga
   beli, untung, jumlah stok, laporan, maupun tombol yang mengubah data.
   ============================================================ */

body{ padding:0; background:var(--bg); }
.toko{ max-width:1080px; margin:0 auto; padding-bottom:120px; }

/* ---------- bilah atas ---------- */
.bilah-toko-atas{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--kartu) 92%, transparent);
  backdrop-filter:saturate(1.6) blur(12px); -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--garis);
  display:flex; align-items:center; gap:12px; padding:10px 16px;
}
.bilah-toko-atas .lambang{
  width:40px; height:40px; border-radius:13px; display:grid; place-items:center; flex:none;
  background:linear-gradient(145deg,var(--utama),#8b5cf6); color:#fff; font-weight:800; font-size:15px;
}
.bilah-toko-atas .judul{ flex:1; min-width:0; line-height:1.25; }
.bilah-toko-atas .judul b{ display:block; font-size:15.5px; font-weight:800; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bilah-toko-atas .judul span{ font-size:12px; color:var(--lemah); }
.tombol-bulat{
  width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:var(--sukses); color:#fff; text-decoration:none; box-shadow:var(--bayang-2);
}
.tombol-bulat svg{ width:22px; height:22px; fill:currentColor; }

/* ---------- sampul ---------- */
.sampul{
  /* Tiga lapis: ilustrasi rak toko di atas, selaput gelap tipis di tengah,
     warna toko di bawah. Selaput itu yang menjaga tulisan tetap terbaca
     berapa pun terangnya gambar. */
  background-image:
    url('hero.svg'),
    linear-gradient(180deg, rgba(15,23,42,.10), rgba(15,23,42,.26)),
    linear-gradient(150deg,#4f46e5,#7c3aed 55%,#9333ea);
  background-position:center center, center, center;
  background-size:cover, cover, cover;
  background-repeat:no-repeat, no-repeat, no-repeat;
  color:#fff; padding:34px 20px 38px; text-align:center; position:relative; overflow:hidden;
  text-shadow:0 1px 3px rgba(15,23,42,.35);
}
.sampul::after{
  content:''; position:absolute; right:-70px; top:-70px; width:240px; height:240px;
  border-radius:50%; background:rgba(255,255,255,.09);
}
.sampul::before{
  content:''; position:absolute; left:-50px; bottom:-90px; width:200px; height:200px;
  border-radius:50%; background:rgba(255,255,255,.07);
}
.sampul h1{ font-size:clamp(23px,5.4vw,31px); letter-spacing:-.02em; position:relative; }
.sampul .jenis{ opacity:.92; font-size:14.5px; margin-top:3px; position:relative; }
.sampul .slogan{ opacity:.8; font-size:13px; margin-top:8px; position:relative; font-style:italic; }
.keping-baris{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; position:relative; }
.keping{
  background:rgba(255,255,255,.18); border-radius:999px; padding:7px 14px;
  font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
}
.keping svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- spanduk berjalan ----------
   Tiga aturan yang membuatnya tidak mengganggu: paling banyak empat helai,
   berhenti begitu disentuh, dan tidak pernah memuat keterangan penting yang
   hanya ada di situ. Yang penting tetap ada di sampul dan kaki halaman. */
.spanduk{ padding:16px 16px 0; }

/* Papan pengumuman berjalan. Isinya digandakan pas dua kali, lalu jalurnya
   digeser tepat setengah panjangnya, sehingga sambungannya tidak terlihat
   dan tulisan mengalir terus tanpa putus. */
.papan-jalan{
  background:linear-gradient(135deg,#7c3aed,#a21caf);
  border-radius:var(--lengkung); overflow:hidden; padding:14px 0;
  box-shadow:var(--bayang-2); position:relative;
}
.papan-jalan::before, .papan-jalan::after{
  content:''; position:absolute; top:0; bottom:0; width:38px; z-index:2; pointer-events:none;
}
.papan-jalan::before{ left:0; background:linear-gradient(90deg,#7c3aed,rgba(124,58,237,0)); }
.papan-jalan::after{ right:0; background:linear-gradient(270deg,#a21caf,rgba(162,28,175,0)); }

.jalur{ display:inline-flex; white-space:nowrap; will-change:transform; }
.papan-jalan:hover .jalur{ animation-play-state:paused; }
.ruas{ display:inline-flex; align-items:center; flex:none; }
.butir{ color:#fff; font-size:14.5px; padding:0 26px; }
.butir b{ font-weight:800; }
.titik-pisah{ color:#fff; opacity:.55; font-size:14.5px; }

@keyframes merayap{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

/* Yang menyetel perangkatnya anti-animasi tetap bisa membaca semuanya
   dengan menggeser sendiri, tanpa ada yang bergerak. */
@media (prefers-reduced-motion: reduce){
  .jalur{ animation:none !important; }
  .papan-jalan{ overflow-x:auto; }
}

/* ---------- pencarian dan kategori ---------- */
.alat-toko{
  position:sticky; top:61px; z-index:40; background:var(--bg);
  padding:14px 16px 8px; border-bottom:1px solid var(--garis);
}
.kotak-cari{ position:relative; }
.kotak-cari svg{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:19px; height:19px; stroke:var(--lemah); fill:none; stroke-width:2; stroke-linecap:round;
}
.kotak-cari input{
  width:100%; padding:13px 14px 13px 42px; font-size:15px; font-family:inherit;
  border:1px solid var(--garis); border-radius:999px; background:var(--kartu); color:var(--teks);
}
.kotak-cari input:focus{ outline:none; border-color:var(--utama); box-shadow:var(--cincin); }

.kategori-baris{ display:flex; gap:8px; overflow-x:auto; padding:12px 0 6px; scrollbar-width:none; }
.kategori-baris::-webkit-scrollbar{ display:none; }
.kategori{
  border:1px solid var(--garis); background:var(--kartu); color:var(--lemah);
  padding:8px 15px; border-radius:999px; cursor:pointer; white-space:nowrap;
  font-size:13.5px; font-weight:700; font-family:inherit; flex:none; transition:.15s;
}
.kategori.aktif{ background:var(--utama); color:#fff; border-color:var(--utama); }

.baris-jumlah{ display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:14px 16px 0; font-size:13px; color:var(--lemah); }
.baris-jumlah select{
  border:1px solid var(--garis); background:var(--kartu); color:var(--teks);
  border-radius:999px; padding:7px 12px; font-size:13px; font-family:inherit;
  font-weight:700; cursor:pointer;
}

/* ---------- kartu barang ---------- */
.rak{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:13px; padding:14px 16px; }
.barang{
  background:var(--kartu); border:1px solid var(--garis); border-radius:var(--lengkung);
  overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--bayang-1);
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .2s, border-color .2s;
}
.barang:hover{ transform:translateY(-3px); box-shadow:var(--bayang-2); border-color:var(--utama); }
.panggung{
  background:linear-gradient(160deg, var(--sorot), color-mix(in srgb, var(--sorot) 40%, var(--kartu)));
  aspect-ratio:1/.82; display:grid; place-items:center; position:relative;
}
.panggung .ikon-barang{ width:58%; height:58%; color:var(--utama); }
.pita{
  position:absolute; top:10px; left:10px; background:var(--bahaya); color:#fff;
  font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; letter-spacing:.03em;
}
.isi-barang{ padding:12px 13px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
.isi-barang .nama{ font-weight:700; font-size:14.5px; line-height:1.35; flex:1;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.isi-barang .harga{ font-size:18px; font-weight:800; color:var(--utama-gelap);
  letter-spacing:-.02em; margin-top:5px; }
[data-tema="gelap"] .isi-barang .harga{ color:#a5b4fc; }
.isi-barang .satuan{ font-size:11.5px; color:var(--lemah); font-weight:600; }
.harga-borong{ margin-top:6px; font-size:12px; font-weight:700; color:var(--ungu);
  background:var(--sorot); border-radius:8px; padding:4px 8px; line-height:1.35; }
.harga-borong small{ display:block; font-weight:600; color:var(--lemah); font-size:10.5px; }
.barang.habis .panggung, .barang.habis .isi-barang{ opacity:.55; }

.aksi-barang{ padding:0 13px 13px; }
.tambah{
  width:100%; border:none; border-radius:10px; padding:10px; cursor:pointer;
  background:var(--utama); color:#fff; font-weight:700; font-size:13.5px; font-family:inherit;
  transition:.15s;
}
.tambah:hover{ filter:brightness(1.08); }
.tambah:disabled{ background:var(--garis); color:var(--lemah); cursor:not-allowed; }
.penghitung{ display:flex; align-items:center; gap:8px; }
.penghitung button{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--utama);
  background:var(--kartu); color:var(--utama); font-size:18px; cursor:pointer;
  font-family:inherit; line-height:1; flex:none;
}
.penghitung span{ flex:1; text-align:center; font-weight:800; font-variant-numeric:tabular-nums; }

/* ---------- keranjang melayang ---------- */
.bilah-pesan{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--kartu); border-top:1px solid var(--garis);
  box-shadow:0 -10px 30px -12px rgba(15,23,42,.3);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px;
  transform:translateY(130%); transition:transform .25s cubic-bezier(.2,.7,.3,1);
}
.bilah-pesan.tampil{ transform:none; }
.bilah-pesan .ringkas-pesan{ flex:1; line-height:1.3; min-width:0; }
.bilah-pesan .ringkas-pesan small{ color:var(--lemah); font-size:12px; font-weight:600; }
.bilah-pesan .ringkas-pesan b{ display:block; font-size:18px; font-weight:800;
  letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.tombol-pesan{
  border:none; border-radius:12px; padding:13px 20px; cursor:pointer; font-family:inherit;
  background:linear-gradient(180deg,#22b45c,#15a34a); color:#fff; font-weight:800; font-size:15px;
  display:flex; align-items:center; gap:8px; box-shadow:var(--bayang-2);
}
.tombol-pesan svg{ width:19px; height:19px; fill:currentColor; }

/* ---------- lembar pesanan ---------- */
.baris-pesanan{
  display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--garis);
}
.baris-pesanan:last-child{ border-bottom:none; }
.baris-pesanan .ikon-barang{ width:38px; height:38px; }
.baris-pesanan .keterangan{ flex:1; min-width:0; line-height:1.35; }
.baris-pesanan .keterangan b{ font-size:14px; font-weight:700; }
.baris-pesanan .keterangan small{ display:block; color:var(--lemah); font-size:12px; }
.baris-pesanan .penghitung{ flex:none; width:118px; }

/* ---------- kaki halaman ---------- */
/* ---------- ajakan jadi pelanggan tetap ---------- */
.ajakan-daftar{
  display:flex; align-items:center; gap:14px; margin:22px 16px 0; padding:18px 20px;
  border-radius:var(--lengkung); background:linear-gradient(135deg,#0d9488,#0891b2);
  color:#fff; box-shadow:var(--bayang-2);
}
.ajakan-daftar b{ display:block; font-size:16px; font-weight:800; }
.ajakan-daftar span{ display:block; font-size:12.5px; opacity:.92; margin-top:3px; line-height:1.5; }
.ajakan-daftar > div{ flex:1; min-width:0; }
.tombol-daftar{
  border:none; border-radius:12px; padding:12px 20px; cursor:pointer; flex:none;
  background:#fff; color:#0f766e; font-weight:800; font-size:14.5px; font-family:inherit;
}
.tombol-daftar:hover{ filter:brightness(.96); }
@media (max-width:560px){ .ajakan-daftar{ margin:18px 12px 0; flex-direction:column; text-align:center; }
  .tombol-daftar{ width:100%; } }

.kaki-toko{
  margin-top:20px; padding:26px 20px 34px; text-align:center;
  border-top:1px solid var(--garis); background:var(--kartu);
}
.kaki-toko h3{ margin-bottom:6px; }
.kaki-toko p{ color:var(--lemah); font-size:13.5px; line-height:1.8; }
.kaki-toko .peringatan{ font-size:12px; margin-top:14px; }

.muat{ text-align:center; padding:54px 20px; color:var(--lemah); }

/* kerangka abu yang berdenyut selagi katalog dimuat */
.rangka{
  height:238px; border-radius:var(--lengkung); border:1px solid var(--garis);
  background:linear-gradient(100deg, var(--kartu) 30%, var(--sorot) 50%, var(--kartu) 70%);
  background-size:280% 100%; animation:denyut 1.4s ease-in-out infinite;
}
@keyframes denyut{ from{ background-position:180% 0 } to{ background-position:-60% 0 } }

/* ---------- tanda buka atau tutup ----------
   Satu-satunya bagian halaman ini yang hidup sendiri tanpa katalog
   diterbitkan ulang, dan justru itu yang paling dicari pembeli sebelum
   berangkat. Karena itu diberi warna penuh, bukan tulisan kecil di kaki. */
.tanda-buka{
  display:inline-flex; align-items:center; gap:9px; flex-wrap:wrap;
  margin-top:18px; padding:9px 18px; border-radius:999px; position:relative;
  font-size:13.5px; font-weight:700;
  background:rgba(255,255,255,.93); color:var(--teks); box-shadow:var(--bayang-2);
}
.tanda-buka .rinci{ font-weight:600; opacity:.72; }
.tanda-buka .titik{ width:9px; height:9px; border-radius:50%; flex:none; background:currentColor; }
.tanda-buka.buka{ color:#0b7a37; }
.tanda-buka.buka .titik{ background:#16a34a; animation:denyut-titik 2s ease-in-out infinite; }
.tanda-buka.segera{ color:#a34b06; }
.tanda-buka.segera .titik{ background:#ea580c; animation:denyut-titik 1.1s ease-in-out infinite; }
.tanda-buka.tutup{ color:#9f1239; }
.tanda-buka.tutup .titik{ background:#e11d48; }
@keyframes denyut-titik{
  0%,100%{ box-shadow:0 0 0 0 currentColor; opacity:1 }
  60%{ box-shadow:0 0 0 6px transparent; opacity:.55 }
}

/* pasangan kecilnya di bilah atas, terlihat terus walaupun halaman digulir */
.tanda-kecil{ display:inline-flex; align-items:center; gap:5px; font-weight:700; }
.tanda-kecil .titik{ width:7px; height:7px; border-radius:50%; flex:none; }
.tanda-kecil.buka{ color:#16a34a; } .tanda-kecil.buka .titik{ background:#16a34a; }
.tanda-kecil.segera{ color:#ea580c; } .tanda-kecil.segera .titik{ background:#ea580c; }
.tanda-kecil.tutup{ color:#e11d48; } .tanda-kecil.tutup .titik{ background:#e11d48; }

/* ---------- wilayah antar ----------
   Diletakkan sebelum daftar barang karena inilah pertanyaan pertama pembeli
   daerah, dan jawabannya yang menentukan toko mana yang dipilih. */
.pita-antar{
  display:flex; align-items:center; gap:14px; margin:14px 16px 0; padding:14px 18px;
  border:1px solid var(--garis); border-left:4px solid var(--sukses);
  border-radius:var(--lengkung); background:var(--kartu); box-shadow:var(--bayang-1);
}
.pita-antar svg{ width:30px; height:30px; flex:none; color:var(--sukses); }
.pita-antar .isi-antar{ min-width:0; line-height:1.55; }
.pita-antar b{ display:block; font-size:14.5px; }
.pita-antar span{ display:block; margin-top:2px; }

/* ---------- membagikan ---------- */
svg.garis{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.tombol-bulat.netral{
  padding:0; background:var(--kartu-2); color:var(--lemah);
  border:1px solid var(--garis); box-shadow:none; cursor:pointer;
}
.tombol-bulat.netral:hover{ color:var(--utama); border-color:var(--utama); background:var(--sorot); }
.tombol-bulat.netral svg{ width:19px; height:19px; }

.bagikan-barang{
  position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  display:grid; place-items:center; cursor:pointer; padding:0;
  border:1px solid var(--garis); background:color-mix(in srgb, var(--kartu) 88%, transparent);
  color:var(--lemah); backdrop-filter:blur(4px); opacity:.5; transition:.16s;
}
.barang:hover .bagikan-barang{ opacity:1; }
.bagikan-barang:hover{ color:var(--utama); border-color:var(--utama); background:var(--kartu); }
.bagikan-barang svg{ width:15px; height:15px; }
/* Layar sentuh tidak mengenal "hover", jadi di HP tombolnya harus terlihat terus. */
@media (hover:none){ .bagikan-barang{ opacity:.9; } }

/* ---------- tombol di kaki halaman ---------- */
.kaki-toko .sejak{ font-size:12.5px; font-weight:700; color:var(--utama); }
.aksi-kaki{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin:16px 0 4px; }
.tombol-kaki{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:700;
  border:1px solid var(--garis); background:var(--kartu); color:var(--teks); transition:.15s;
}
.tombol-kaki:hover{ border-color:var(--utama); color:var(--utama); background:var(--sorot); }
.tombol-kaki svg{ width:17px; height:17px; }
.tombol-kaki.utama{ background:var(--sukses); border-color:transparent; color:#fff; }
.tombol-kaki.utama:hover{ background:#0f8a3d; color:#fff; }
.tombol-kaki.utama svg{ fill:currentColor; }

/* ---------- catatan sekejap ---------- */
.catatan-layar{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%, 16px); z-index:90;
  background:var(--teks); color:#fff; padding:11px 18px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:var(--bayang-3);
  opacity:0; pointer-events:none; transition:.22s; max-width:90vw; text-align:center;
}
.catatan-layar.tampil{ opacity:1; transform:translate(-50%, 0); }

@media (max-width:560px){
  .rak{ grid-template-columns:repeat(2,1fr); gap:11px; padding:12px; }
  .alat-toko{ padding:12px 12px 6px; }
  .baris-jumlah{ padding:12px 12px 0; }
  .isi-barang .harga{ font-size:16.5px; }
  .sampul{ padding:26px 16px 30px; }
  .tanda-buka{ font-size:12.5px; padding:8px 14px; gap:7px; }
  .pita-antar{ margin:12px 12px 0; padding:12px 14px; gap:11px; }
  .pita-antar svg{ width:26px; height:26px; }
  .pita-antar b{ font-size:13.5px; }
}
</style>
</head>
<body>

<div class="toko">
  <div class="bilah-toko-atas">
    <div class="lambang" id="k-lambang">T</div>
    <div class="judul"><b id="k-nama-atas">Katalog</b><span id="k-jenis-atas"></span></div>
    <button class="tombol-bulat netral" id="k-bagikan-toko" aria-label="Bagikan katalog toko"
            title="Bagikan katalog ini">

      <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.45 1.34 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.5 0 9.96-4.46 9.96-9.96 0-2.66-1.04-5.16-2.92-7.04A9.88 9.88 0 0 0 12.04 2m0 1.67c2.22 0 4.3.86 5.87 2.43a8.24 8.24 0 0 1 2.43 5.86c0 4.58-3.72 8.3-8.3 8.3a8.23 8.23 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.27-4.44c0-4.57 3.72-8.29 8.3-8.29m-3.2 4.2c-.15 0-.4.06-.6.3-.21.23-.8.78-.8 1.9s.82 2.2.93 2.36c.12.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.03.15 1.42.09.43-.07 1.34-.55 1.53-1.08.19-.53.19-.98.13-1.08-.06-.1-.21-.15-.44-.27-.23-.11-1.34-.66-1.55-.74-.2-.07-.36-.11-.51.12-.15.22-.58.73-.71.88-.13.15-.26.17-.49.06-.23-.12-.96-.36-1.83-1.13-.68-.6-1.13-1.35-1.27-1.58-.13-.23-.01-.35.1-.47.1-.1.23-.27.34-.4.12-.14.15-.23.23-.39.08-.15.04-.29-.02-.4-.06-.12-.51-1.23-.7-1.68-.18-.44-.37-.38-.5-.39z"/></svg>

  <div class="sampul">

    <!-- Tanda buka atau tutup. Inilah yang paling dicari pembeli sebelum

    <div class="tanda-buka tersembunyi" id="k-tanda-buka"></div>

  <div class="pita-antar tersembunyi" id="k-antar">

      Untuk memastikan sebelum datang, silakan hubungi toko lebih dulu.

<div class="bilah-pesan" id="k-bilah-pesan">
  <div class="ringkas-pesan">
    <small id="k-pesan-jumlah">0 barang</small>
    <b id="k-pesan-total">Rp 0</b>
  </div>
  <button class="tombol-pesan" id="k-buka-pesanan">
    <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.45 1.34 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.5 0 9.96-4.46 9.96-9.96 0-2.66-1.04-5.16-2.92-7.04A9.88 9.88 0 0 0 12.04 2m0 1.67c2.22 0 4.3.86 5.87 2.43a8.24 8.24 0 0 1 2.43 5.86c0 4.58-3.72 8.3-8.3 8.3a8.23 8.23 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.27-4.44c0-4.57 3.72-8.29 8.3-8.29"/></svg>
    Pesan
  </button>

<div id="latar-modal" class="latar-modal tersembunyi">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-atas"><h3 id="modal-judul"></h3><button id="modal-tutup" class="tombol-ikon">&times;</button></div>
    <div id="modal-isi" class="modal-isi"></div>
    <div id="modal-aksi" class="modal-aksi"></div>
  </div>
</div>

<script src="ikon-barang.js"></script>
<script>
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pemformat = new Intl.NumberFormat('id-ID');
const angka = n => pemformat.format(Math.round(Number(n) || 0));
const rupiah = n => 'Rp ' + angka(n);
const aman = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inisial(nama) {
  const kata = String(nama || '?').trim().split(/\s+/);
  return ((kata[0]?.[0] || '') + (kata[1]?.[0] || '')).toUpperCase() || '?';
}

let katalog = null;
let katalogTerbaca = false;   // berkasnya sampai, walaupun penggambarannya mungkin gagal
let kategoriTerpilih = 'Semua';
let pesanan = {};   // nama barang -> jumlah

/* Pilihan pembeli disimpan di HP mereka sendiri, supaya tidak hilang kalau
   halaman tertutup sebelum sempat dikirim. Tidak ada yang sampai ke toko
   sebelum tombol WhatsApp ditekan. */
const KUNCI_PESANAN = 'katalogManjadda.pesanan';
try { pesanan = JSON.parse(localStorage.getItem(KUNCI_PESANAN) || '{}'); } catch (e) { pesanan = {}; }
function simpanPesanan() {
  try { localStorage.setItem(KUNCI_PESANAN, JSON.stringify(pesanan)); } catch (e) { /* abaikan */ }
}

/* ---------- daftar barang ---------- */

function barangTersaring() {
  const cari = $('#k-cari').value.trim().toLowerCase();
  const daftar = (katalog.barang || []).filter(b =>
    (kategoriTerpilih === 'Semua' || kategoriBarang(b) === kategoriTerpilih) &&
    (!cari || b.nama.toLowerCase().includes(cari) || kategoriBarang(b).toLowerCase().includes(cari)));

  const abjad = (a, b) => a.nama.localeCompare(b.nama, 'id');
  const urut = $('#k-urut').value;
  if (urut === 'murah') daftar.sort((a, b) => (a.hargaJual - b.hargaJual) || abjad(a, b));
  else if (urut === 'mahal') daftar.sort((a, b) => (b.hargaJual - a.hargaJual) || abjad(a, b));
  else daftar.sort(abjad);

  // barang habis selalu turun ke bawah supaya yang bisa dibeli terlihat lebih dulu
  return daftar.sort((a, b) => (a.tersedia === b.tersedia) ? 0 : (a.tersedia ? -1 : 1));
}

function gambarRak() {
  const daftar = barangTersaring();
  $('#k-jumlah').textContent = `${angka(daftar.length)} barang`;
  $('#k-rak').innerHTML = daftar.map(b => {
    const jumlah = pesanan[b.nama] || 0;
    return `<div class="barang ${b.tersedia ? '' : 'habis'}">
      <div class="panggung">
        ${ikonBarang(b)}
        ${b.tersedia ? '' : '<span class="pita">Stok habis</span>'}
        <button class="bagikan-barang" data-bagikan="${aman(b.nama)}"
                title="Bagikan barang ini" aria-label="Bagikan ${aman(b.nama)}">
          <svg viewBox="0 0 24 24" class="garis"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8 15.7 6.4M8.3 13.2l7.4 4.4"/></svg>
        </button>
      </div>
      <div class="isi-barang">
        <span class="nama">${aman(b.nama)}</span>
        <span class="harga">${rupiah(b.hargaJual)}</span>
        <span class="satuan">per ${aman(b.satuan || 'pcs')} &middot; ${aman(kategoriBarang(b))}</span>
        ${b.grosirJumlah > 1 && b.grosirHarga > 0
          ? `<span class="harga-borong">${rupiah(b.grosirHarga)} per ${aman(b.grosirSatuan)}
              <small>isi ${angka(b.grosirJumlah)}</small></span>` : ''}
      </div>
      <div class="aksi-barang">
        ${!b.tersedia
          ? '<button class="tambah" disabled>Kosong</button>'
          : jumlah
            ? `<div class="penghitung">
                 <button data-kurang="${aman(b.nama)}" aria-label="Kurangi">&minus;</button>
                 <span>${angka(jumlah)}</span>
                 <button data-tambah="${aman(b.nama)}" aria-label="Tambah">+</button>
               </div>`
            : `<button class="tambah" data-tambah="${aman(b.nama)}">+ Pilih</button>`}
      </div>
    </div>`;
  }).join('');

  $('#k-pesan-kosong').textContent = daftar.length ? '' :
    'Barang tidak ditemukan. Coba kata lain, atau pilih kategori Semua.';
  $('#k-pesan-kosong').classList.toggle('tersembunyi', daftar.length > 0);
  gambarBilahPesan();
}

function ubahPesanan(nama, selisih) {
  const barang = (katalog?.barang || []).find(b => b.nama === nama);
  if (!barang || !barang.tersedia) return;
  const baru = (pesanan[nama] || 0) + selisih;
  if (baru <= 0) delete pesanan[nama]; else pesanan[nama] = baru;
  simpanPesanan();
  gambarRak();
  if (!$('#latar-modal').classList.contains('tersembunyi')) {
    if (isiPesanan().length) bukaPesanan(); else tutupModal();
  }
}

/* ---------- keranjang dan pesanan ---------- */

function isiPesanan() {
  return Object.entries(pesanan).map(([nama, jumlah]) => {
    const b = (katalog?.barang || []).find(x => x.nama === nama);
    return b ? Object.assign({}, b, { jumlah }) : null;
  }).filter(Boolean);
}

function gambarBilahPesan() {
  const isi = isiPesanan();
  const jumlahBarang = isi.reduce((j, i) => j + i.jumlah, 0);
  const total = isi.reduce((j, i) => j + i.jumlah * i.hargaJual, 0);
  $('#k-pesan-jumlah').textContent = `${angka(jumlahBarang)} barang dipilih`;
  $('#k-pesan-total').textContent = rupiah(total);
  $('#k-bilah-pesan').classList.toggle('tampil', jumlahBarang > 0);
}

function nomorWa(telepon) {
  const a = String(telepon || '').replace(/\D/g, '');
  if (!a) return '';
  if (a.startsWith('62')) return a;
  if (a.startsWith('0')) return '62' + a.slice(1);
  return a;
}

function tutupModal() { $('#latar-modal').classList.add('tersembunyi'); }

function bukaPesanan() {
  const isi = isiPesanan();
  if (!isi.length) return;
  const total = isi.reduce((j, i) => j + i.jumlah * i.hargaJual, 0);
  const namaLama = $('#k-nama-pembeli')?.value || '';
  const catatanLama = $('#k-catatan')?.value || '';

  $('#modal-judul').textContent = 'Pesanan Saya';
  $('#modal-isi').innerHTML = `
    ${isi.map(i => `
      <div class="baris-pesanan">
        ${ikonBarang(i)}
        <span class="keterangan"><b>${aman(i.nama)}</b>
          <small>${angka(i.jumlah)} ${aman(i.satuan || 'pcs')} &times; ${rupiah(i.hargaJual)}
            = ${rupiah(i.jumlah * i.hargaJual)}</small></span>
        <span class="penghitung">
          <button data-kurang="${aman(i.nama)}">&minus;</button>
          <span>${angka(i.jumlah)}</span>
          <button data-tambah="${aman(i.nama)}">+</button>
        </span>
      </div>`).join('')}
    <div class="baris besar" style="margin-top:10px"><span>Perkiraan total</span><b>${rupiah(total)}</b></div>
    <label style="margin-top:14px">Nama Anda
      <input id="k-nama-pembeli" class="input" type="text" placeholder="Contoh: Ibu Ani"
             value="${aman(namaLama)}"></label>
    <label style="margin-top:12px">Catatan <span class="lemah kecil">(warna, ukuran, waktu ambil)</span>
      <input id="k-catatan" class="input" type="text" placeholder="Boleh dikosongkan"
             value="${aman(catatanLama)}"></label>
    <p class="lemah kecil" style="margin-top:14px">
      Tombol di bawah akan membuka WhatsApp berisi daftar ini. Pesanan dianggap jadi
      setelah dibalas oleh toko.</p>`;

  $('#modal-aksi').innerHTML = '';
  const kosongkan = document.createElement('button');
  kosongkan.className = 'tombol tombol-netral';
  kosongkan.textContent = 'Kosongkan';
  kosongkan.onclick = () => { pesanan = {}; simpanPesanan(); gambarRak(); tutupModal(); };
  const kirim = document.createElement('button');
  kirim.className = 'tombol tombol-sukses';
  kirim.textContent = 'Kirim lewat WhatsApp';
  kirim.onclick = kirimPesanan;
  $('#modal-aksi').append(kosongkan, kirim);
  $('#latar-modal').classList.remove('tersembunyi');
}

function kirimPesanan() {
  const isi = isiPesanan();
  if (!isi.length) return;
  const toko = katalog.toko || {};
  const wa = nomorWa(toko.telepon);
  const total = isi.reduce((j, i) => j + i.jumlah * i.hargaJual, 0);
  const pembeli = ($('#k-nama-pembeli')?.value || '').trim();
  const catatan = ($('#k-catatan')?.value || '').trim();

  const baris = [`Halo ${toko.nama || 'Toko'}, saya mau pesan:`, ''];
  isi.forEach((i, urut) => baris.push(
    `${urut + 1}. ${i.nama} - ${i.jumlah} ${i.satuan || 'pcs'} x ${rupiah(i.hargaJual)} = ${rupiah(i.jumlah * i.hargaJual)}`));
  baris.push('', `Perkiraan total: ${rupiah(total)}`);
  if (pembeli) baris.push('', `Nama: ${pembeli}`);
  if (catatan) baris.push(`Catatan: ${catatan}`);
  baris.push('', '(dikirim dari katalog online toko)');
  const teks = baris.join('\n');

  if (wa) {
    window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(teks), '_blank', 'noopener');
    tutupModal();
    return;
  }
  // Toko belum mengisi nomor telepon: daftarnya tetap bisa disalin pembeli.
  try { navigator.clipboard?.writeText(teks); } catch (e) { /* abaikan */ }
  $('#modal-judul').textContent = 'Nomor toko belum tersedia';
  $('#modal-isi').innerHTML = `<p>Daftar pesanan sudah disalin. Silakan tempel dan kirim ke toko,
    atau tunjukkan langsung saat datang.</p>
    <pre style="white-space:pre-wrap;background:var(--kartu-2);padding:12px;border-radius:12px;
      margin-top:12px;font-size:13px">${aman(teks)}</pre>`;
  $('#modal-aksi').innerHTML = '';
}

/* ---------- mendaftar jadi pelanggan tetap ----------
   Tidak ada pelayan data di balik halaman ini, jadi pendaftarannya dikirim
   sebagai pesan WhatsApp biasa. Pemilik menempelnya sekali di aplikasi
   kasir, dan pembeli tidak perlu membuat akun atau kata sandi apa pun. */
function bukaPendaftaran() {
  const toko = katalog?.toko || {};
  $('#modal-judul').textContent = 'Jadi Pelanggan Tetap';
  $('#modal-isi').innerHTML = `
    <p class="lemah">Cukup nama dan satu nomor HP. Tidak perlu kata sandi,
      tidak perlu kode apa pun.</p>
    <label style="margin-top:16px">Nama Anda
      <input id="d-nama" class="input input-besar" type="text" autocomplete="name"
             placeholder="Contoh: Ibu Ani"></label>
    <label style="margin-top:12px">Nomor HP <span class="lemah kecil">atau alamat email</span>
      <input id="d-kontak" class="input input-besar" type="text" autocomplete="tel"
             placeholder="0813-7189-7171"></label>
    <p id="d-pesan" class="kecil" style="color:var(--bahaya);min-height:18px;margin-top:10px"></p>
    <p class="lemah kecil">Menekan tombol di bawah akan membuka WhatsApp berisi data ini,
      lalu Anda tinggal mengirimnya ke toko.</p>`;

  $('#modal-aksi').innerHTML = '';
  const batal = document.createElement('button');
  batal.className = 'tombol tombol-netral';
  batal.textContent = 'Batal';
  batal.onclick = tutupModal;
  const kirim = document.createElement('button');
  kirim.className = 'tombol tombol-sukses';
  kirim.textContent = 'Kirim lewat WhatsApp';
  kirim.onclick = () => {
    const nama = $('#d-nama').value.trim();
    const kontak = $('#d-kontak').value.trim();
    if (!nama) { $('#d-pesan').textContent = 'Nama belum diisi.'; return; }
    if (!kontak) { $('#d-pesan').textContent = 'Nomor HP atau email belum diisi.'; return; }
    const teks = [
      `Halo ${toko.nama || 'Toko'}, saya mau daftar jadi pelanggan.`, '',
      `Nama: ${nama}`, `HP/Email: ${kontak}`, '', '(dikirim dari katalog online)'
    ].join('\n');
    const wa = nomorWa(toko.telepon);
    if (wa) {
      window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(teks), '_blank', 'noopener');
      tutupModal();
    } else {
      try { navigator.clipboard?.writeText(teks); } catch (e) { /* abaikan */ }
      $('#d-pesan').style.color = 'var(--lemah)';
      $('#d-pesan').textContent = 'Nomor toko belum tersedia. Data sudah disalin, kirimkan sendiri ke toko.';
    }
  };
  $('#modal-aksi').append(batal, kirim);
  $('#latar-modal').classList.remove('tersembunyi');
}

/* ---------- papan pengumuman berjalan ---------- */

const LAJU_SPANDUK = 62;   // piksel per detik, kecepatan yang masih enak dibaca
let daftarPromo = [];
let janjiUkurUlang = null;

function gambarSpanduk(daftar) {
  daftarPromo = (Array.isArray(daftar) ? daftar : []).filter(p => p && p.judul);
  if (!daftarPromo.length) return;
  $('#k-spanduk').classList.remove('tersembunyi');
  susunJalur();
}

function satuRuas() {
  return daftarPromo.map(p =>
    `<span class="butir"><b>${aman(p.judul)}</b> ${aman(p.teks || '')}</span>`
  ).join('<span class="titik-pisah">&#9679;</span>');
}

/* Isi digandakan secukupnya sampai separuh jalur lebih panjang daripada
   papannya, lalu digandakan sekali lagi. Dengan begitu geseran sebesar
   setengah panjang jalur mengembalikan tampilan ke keadaan semula, dan
   sambungannya tidak pernah terlihat. */
function susunJalur() {
  const jalur = $('#k-jalur');
  if (!jalur || !daftarPromo.length) return;
  const papan = jalur.parentElement;

  jalur.style.animation = 'none';
  jalur.innerHTML = `<span class="ruas">${satuRuas()}</span>`;
  const lebarSatu = jalur.firstElementChild.getBoundingClientRect().width || 600;
  const lebarPapan = papan.getBoundingClientRect().width || 360;

  const salinanSeparuh = Math.max(1, Math.ceil(lebarPapan / lebarSatu));
  jalur.innerHTML = Array.from({ length: salinanSeparuh * 2 }, (v, urut) =>
    `<span class="ruas"${urut ? ' aria-hidden="true"' : ''}>${satuRuas()}</span>`).join('');

  const lebarSeparuh = salinanSeparuh * lebarSatu;
  const detik = Math.max(14, Math.round(lebarSeparuh / LAJU_SPANDUK));
  jalur.style.animation = `merayap ${detik}s linear infinite`;
}

/* Lebar papan berubah saat layar diputar atau jendela diubah ukurannya,
   jadi jalurnya disusun ulang, ditunda sebentar supaya tidak berkali-kali. */
window.addEventListener('resize', () => {
  clearTimeout(janjiUkurUlang);
  janjiUkurUlang = setTimeout(susunJalur, 250);
});

/* ---------- buka atau tutup sekarang ---------- */

const NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

const keMenit = jam => {
  const cocok = /^(\d{1,2}):(\d{2})$/.exec(String(jam || '').trim());
  return cocok ? Number(cocok[1]) * 60 + Number(cocok[2]) : null;
};
const tulisJam = menit =>
  String(Math.floor(menit / 60)).padStart(2, '0') + '.' + String(menit % 60).padStart(2, '0');

/** Hanya alamat http yang boleh masuk ke href. Isinya datang dari pengaturan
    toko, tetapi satu salah tempel tidak boleh bisa menjalankan apa pun. */
const tautanAman = t => /^https?:\/\//i.test(String(t || '')) ? String(t) : '';

/** Menghitung sendiri toko sedang buka atau tutup, memakai jam di HP pembeli.
    Mengembalikan null bila jam buka belum diisi, supaya tandanya disembunyikan
    daripada memajang tebakan. Jam tutup yang lebih kecil daripada jam buka
    dibaca sebagai lewat tengah malam, misalnya 18.00 - 01.00. */
function keadaanBuka(toko, saat = new Date()) {
  const buka = keMenit(toko.bukaJam);
  const tutup = keMenit(toko.tutupJam);
  if (buka === null || tutup === null) return null;

  const libur = Array.isArray(toko.hariLibur) ? toko.hariLibur : [];
  if (libur.length >= 7) return { terbuka: false, keterangan: 'Sedang tutup sampai pemberitahuan berikutnya' };

  const hariIni = saat.getDay();
  const sekarang = saat.getHours() * 60 + saat.getMinutes();
  const lewatTengahMalam = tutup <= buka;

  // dini hari masih milik hari sebelumnya kalau tokonya tutup lewat tengah malam
  const hariPemilik = (lewatTengahMalam && sekarang < tutup) ? (hariIni + 6) % 7 : hariIni;
  const dalamJam = lewatTengahMalam
    ? (sekarang >= buka || sekarang < tutup)
    : (sekarang >= buka && sekarang < tutup);

  if (dalamJam && !libur.includes(hariPemilik)) {
    const sisa = (tutup - sekarang + 1440) % 1440;
    return {
      terbuka: true, segera: sisa <= 60,
      keterangan: sisa <= 60
        ? `Tutup ${sisa} menit lagi, pukul ${tulisJam(tutup)}`
        : `Tutup pukul ${tulisJam(tutup)}`
    };
  }

  // mencari hari buka berikutnya, paling jauh seminggu ke depan
  for (let maju = 0; maju <= 7; maju++) {
    const hari = (hariIni + maju) % 7;
    if (libur.includes(hari)) continue;
    if (maju === 0 && sekarang >= buka) continue;   // jam buka hari ini sudah lewat
    const kapan = maju === 0 ? 'hari ini' : maju === 1 ? 'besok' : 'hari ' + NAMA_HARI[hari];
    return { terbuka: false, keterangan: `Buka ${kapan} pukul ${tulisJam(buka)}` };
  }
  return { terbuka: false, keterangan: 'Sedang tutup' };
}

function gambarTandaBuka() {
  const toko = katalog?.toko || {};
  const keadaan = keadaanBuka(toko);
  const tanda = $('#k-tanda-buka');
  const atas = $('#k-jenis-atas');

  if (!keadaan) {
    tanda.className = 'tanda-buka tersembunyi';
    atas.textContent = toko.jenis || '';
    return;
  }
  const warna = keadaan.terbuka ? (keadaan.segera ? 'segera' : 'buka') : 'tutup';
  const kata = keadaan.terbuka ? 'Buka sekarang' : 'Tutup';
  tanda.className = 'tanda-buka ' + warna;
  tanda.innerHTML = `<span class="titik"></span><b>${kata}</b>
    <span class="rinci">${aman(keadaan.keterangan)}</span>`;
  atas.innerHTML = `${aman(toko.jenis || '')}${toko.jenis ? ' &middot; ' : ''}<span
    class="tanda-kecil ${warna}"><span class="titik"></span>${kata}</span>`;
}

/* ---------- wilayah antar dan tombol menuju toko ---------- */

function gambarAntar(toko) {
  const wilayah = (Array.isArray(toko.wilayahAntar) ? toko.wilayahAntar : []).filter(Boolean);
  if (!wilayah.length) return;
  $('#k-antar-wilayah').textContent = 'Bisa antar ke ' + wilayah.join(' · ');
  $('#k-antar-catatan').textContent = toko.catatanAntar || '';
  $('#k-antar').classList.remove('tersembunyi');
}

const IKON_KAKI = {
  wa: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 5-1.3A10 10 0 1 0 12 2m0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.5.7.7-2.4-.2-.3A8 8 0 0 1 12 4m-2.6 3.9c-.13 0-.34.05-.52.25-.18.2-.68.67-.68 1.63s.7 1.88.8 2.01c.1.13 1.36 2.08 3.3 2.92 1.62.7 1.95.56 2.3.53.35-.03 1.14-.47 1.3-.92.16-.45.16-.84.11-.92-.05-.08-.18-.13-.38-.23s-1.14-.56-1.32-.63c-.18-.06-.3-.09-.43.1-.13.2-.5.63-.6.76-.12.13-.23.14-.42.05-.2-.1-.83-.31-1.57-.97-.58-.52-.97-1.16-1.09-1.35-.11-.2-.01-.3.09-.4.09-.09.2-.23.3-.35.09-.13.12-.22.19-.35.06-.13.03-.25-.02-.35-.05-.1-.43-1.05-.6-1.43-.15-.37-.31-.32-.43-.33z"/></svg>',
  telepon: '<svg viewBox="0 0 24 24" class="garis"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  peta: '<svg viewBox="0 0 24 24" class="garis"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>'
};

/** Tiga tombol yang menutup jarak antara melihat katalog dan benar-benar
    sampai ke toko: bertanya, menelepon, dan membuka peta. */
function gambarAksiKaki(toko) {
  const tombol = [];
  const wa = nomorWa(toko.telepon);
  if (wa) tombol.push(`<a class="tombol-kaki utama" target="_blank" rel="noopener"
      href="https://wa.me/${wa}">${IKON_KAKI.wa} WhatsApp</a>`);
  if (toko.telepon) tombol.push(`<a class="tombol-kaki"
      href="tel:${aman(String(toko.telepon).replace(/[^\d+]/g, ''))}">${IKON_KAKI.telepon} Telepon</a>`);
  if (tautanAman(toko.petaTautan)) tombol.push(`<a class="tombol-kaki" target="_blank" rel="noopener"
      href="${aman(tautanAman(toko.petaTautan))}">${IKON_KAKI.peta} Lihat di Peta</a>`);
  $('#k-aksi-kaki').innerHTML = tombol.join('');

  if (toko.sejakTahun) {
    $('#k-kaki-sejak').textContent = 'Melayani sejak tahun ' + toko.sejakTahun;
    $('#k-kaki-sejak').classList.remove('tersembunyi');
  }
}

/* ---------- membagikan ----------
   Di pasar daerah, satu tautan yang diteruskan di grup WhatsApp menjangkau
   lebih banyak orang daripada iklan mana pun. Jadi setiap barang bisa
   dibagikan sendiri-sendiri, bukan hanya katalognya secara keseluruhan. */

const alamatHalaman = barang =>
  location.origin + location.pathname + (barang ? '?b=' + encodeURIComponent(barang) : '');

let janjiCatatan = null;
function tunjukkanCatatan(teks) {
  let kotak = $('#k-catatan-layar');
  if (!kotak) {
    kotak = document.createElement('div');
    kotak.id = 'k-catatan-layar';
    kotak.className = 'catatan-layar';
    document.body.appendChild(kotak);
  }
  kotak.textContent = teks;
  kotak.classList.add('tampil');
  clearTimeout(janjiCatatan);
  janjiCatatan = setTimeout(() => kotak.classList.remove('tampil'), 3500);
}

/** Memakai tombol bagi bawaan HP bila ada; di Android itu memunculkan
    WhatsApp, Facebook, dan yang lain sekaligus. Di komputer yang tidak
    punya tombol itu, tautannya disalin supaya tetap bisa ditempel. */
async function bagikan(judul, teks) {
  if (navigator.share) {
    try { await navigator.share({ title: judul, text: teks }); return; }
    catch (galat) { if (galat && galat.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(teks);
    tunjukkanCatatan('Tautan sudah disalin. Tinggal ditempel di WhatsApp.');
  } catch (galat) {
    window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank', 'noopener');
  }
}

function bagikanToko() {
  const toko = katalog?.toko || {};
  bagikan(toko.nama || 'Katalog toko', [
    `${toko.nama || 'Katalog toko'}${toko.jenis ? ' - ' + toko.jenis : ''}`,
    toko.alamat || '', toko.jamBuka || '', '', alamatHalaman()
  ].filter(Boolean).join('\n'));
}

function bagikanBarang(nama) {
  const b = (katalog?.barang || []).find(x => x.nama === nama);
  if (!b) return;
  const toko = katalog?.toko || {};
  bagikan(b.nama, [
    `${b.nama} - ${rupiah(b.hargaJual)} per ${b.satuan || 'pcs'}`,
    b.grosirJumlah > 1 && b.grosirHarga > 0
      ? `Harga ${b.grosirSatuan}: ${rupiah(b.grosirHarga)} isi ${angka(b.grosirJumlah)}` : '',
    '', `Ada di ${toko.nama || 'toko kami'}${toko.alamat ? ', ' + toko.alamat : ''}`,
    alamatHalaman(b.nama)
  ].filter(Boolean).join('\n'));
}

/* ---------- keterangan untuk mesin pencari ----------
   Bagian ini yang membuat pencarian "toko pecah belah Kubu" bisa sampai ke
   sini. Google membacanya untuk mengerti bahwa halaman ini toko sungguhan:
   di mana alamatnya, jam berapa buka, nomor berapa, dan melayani daerah
   mana. Disusun dari data toko, bukan ditulis tangan, supaya keterangan di
   mesin pencari tidak pernah berbeda dengan yang dilihat pembeli. */

const HARI_INGGRIS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function pasangDataTerstruktur(data) {
  const toko = data.toko || {};
  const harga = (data.barang || []).map(b => Number(b.hargaJual) || 0).filter(h => h > 0);
  const libur = Array.isArray(toko.hariLibur) ? toko.hariLibur : [];
  const wilayah = (Array.isArray(toko.wilayahAntar) ? toko.wilayahAntar : []).filter(Boolean);
  const hariBuka = HARI_INGGRIS.filter((nama, h) => !libur.includes(h));

  const keterangan = {
    '@context': 'https://schema.org',
    '@type': 'HomeGoodsStore',
    name: toko.nama || '',
    description: toko.slogan || '',
    url: alamatHalaman(),
    image: new URL('ikon-512.png', location.href).href,
    telephone: toko.telepon || undefined,
    address: {
      '@type': 'PostalAddress',
      streetAddress: toko.alamat || '',
      addressLocality: 'Kubu', addressRegion: 'Riau', addressCountry: 'ID'
    },
    currenciesAccepted: 'IDR'
  };
  if (wilayah.length) keterangan.areaServed = wilayah.map(w => ({ '@type': 'Place', name: w }));
  if (toko.sejakTahun) keterangan.foundingDate = String(toko.sejakTahun);
  if (tautanAman(toko.petaTautan)) keterangan.hasMap = tautanAman(toko.petaTautan);
  if (keMenit(toko.bukaJam) !== null && keMenit(toko.tutupJam) !== null && hariBuka.length) {
    keterangan.openingHoursSpecification = [{
      '@type': 'OpeningHoursSpecification',
      dayOfWeek: hariBuka, opens: toko.bukaJam, closes: toko.tutupJam
    }];
  }
  if (harga.length) {
    keterangan.priceRange = 'Rp' + angka(Math.min(...harga)) + ' - Rp' + angka(Math.max(...harga));
  }

  const wadah = document.createElement('script');
  wadah.type = 'application/ld+json';
  wadah.textContent = JSON.stringify(keterangan).replace(/</g, '\\u003c');
  document.head.appendChild(wadah);

  // alamat resmi halaman, supaya tautan bercabang tidak dihitung dua kali
  const kanonik = document.createElement('link');
  kanonik.rel = 'canonical';
  kanonik.href = alamatHalaman();
  document.head.appendChild(kanonik);

  document.title = [toko.nama || 'Katalog', toko.jenis, toko.alamat].filter(Boolean).join(' - ');
}

/* ---------- memuat katalog ---------- */

const IKON_KEPING = {
  alamat: '<svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  telepon: '<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  jam: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

fetch('katalog.json?t=' + Date.now())
  .then(j => { if (!j.ok) throw new Error('belum ada'); return j.json(); })
  .then(data => {
    katalog = data;
    katalogTerbaca = true;
    const toko = data.toko || {};

    $('#k-lambang').textContent = inisial(toko.nama);
    $('#k-nama-atas').textContent = toko.nama || 'Katalog';
    $('#k-jenis-atas').textContent = toko.jenis || '';
    $('#k-nama').textContent = toko.nama || 'Katalog';
    $('#k-jenis').textContent = toko.jenis || '';
    $('#k-slogan').textContent = toko.slogan || '';
    $('#k-kaki-nama').textContent = toko.nama || '';

    const keping = [];
    if (toko.alamat) keping.push(`<span class="keping">${IKON_KEPING.alamat}${aman(toko.alamat)}</span>`);
    if (toko.telepon) keping.push(`<span class="keping">${IKON_KEPING.telepon}${aman(toko.telepon)}</span>`);
    if (toko.jamBuka) keping.push(`<span class="keping">${IKON_KEPING.jam}${aman(toko.jamBuka)}</span>`);
    $('#k-keping').innerHTML = keping.join('');
    $('#k-kaki-info').innerHTML = [toko.alamat, toko.telepon, toko.jamBuka]
      .filter(Boolean).map(aman).join('<br>');
    $('#k-kaki-waktu').textContent = data.waktu
      ? ', ' + new Date(data.waktu).toLocaleString('id-ID',
        { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '';

    const wa = nomorWa(toko.telepon);
    if (wa) {
      const t = $('#k-wa-atas');
      t.href = 'https://wa.me/' + wa + '?text=' +
        encodeURIComponent('Halo ' + (toko.nama || '') + ', saya mau bertanya tentang barang di katalog.');
      t.classList.remove('tersembunyi');
    }

    // kategori disusun dari barang yang benar-benar ada di toko
    const adaKategori = [...new Set((data.barang || []).map(kategoriBarang))].sort();
    $('#k-kategori').innerHTML = ['Semua', ...adaKategori].map((k, urut) =>
      `<button class="kategori ${urut === 0 ? 'aktif' : ''}" data-kategori="${aman(k)}">${aman(k)}</button>`).join('');

    gambarSpanduk(toko.promo);
    gambarAntar(toko);
    gambarAksiKaki(toko);
    gambarTandaBuka();
    /* Tanda buka/tutup dihitung ulang tiap menit, jadi halaman yang dibiarkan
       terbuka di HP pembeli tidak pernah memajang keterangan basi. Inilah
       satu-satunya bagian halaman ini yang berubah tanpa katalog diterbitkan
       ulang, dan itu memang yang paling sering ditanyakan pembeli. */
    setInterval(gambarTandaBuka, 60000);
    pasangDataTerstruktur(data);

    /* Tautan yang dibagikan boleh menunjuk satu barang: ?b=Nama Barang.
       Namanya cukup ditaruh di kotak cari, sehingga penerima tautan melihat
       barang yang dimaksud sekaligus tahu cara kembali ke daftar penuh. */
    const barangDitunjuk = new URLSearchParams(location.search).get('b');
    if (barangDitunjuk) $('#k-cari').value = barangDitunjuk;

    $('#k-kerangka').classList.add('tersembunyi');
    $('#k-alat').classList.remove('tersembunyi');
    $('#k-baris-jumlah').classList.remove('tersembunyi');
    gambarRak();
  })
  .catch(galat => {
    $('#k-kerangka').classList.add('tersembunyi');
    $('#k-pesan-kosong').classList.remove('tersembunyi');
    /* Dua sebab yang sama sekali berbeda, jadi jangan disamakan. Katalog yang
       belum pernah diterbitkan itu keadaan wajar dan pembeli tinggal menunggu.
       Katalog yang berkasnya sampai tetapi gagal digambar itu kerusakan, dan
       menyebutnya "belum diterbitkan" akan membuat pembeli menunggu sesuatu
       yang tidak akan pernah datang. */
    $('#k-pesan-kosong').innerHTML = katalogTerbaca
      ? `<b>Katalog gagal ditampilkan.</b><br>
         <span class="kecil">Coba muat ulang halaman ini. Kalau tetap begini, hubungi toko
           langsung. Keterangan teknis: ${aman((galat && galat.message) || galat)}</span>`
      : `<b>Katalog belum diterbitkan.</b><br>
         <span class="kecil">Pemilik toko dapat menerbitkannya lewat menu Pengaturan di aplikasi kasir.</span>`;
  });

/* ---------- pendengar ---------- */

$('#k-cari').addEventListener('input', () => gambarRak());
$('#k-urut').addEventListener('change', () => gambarRak());
$('#k-kategori').addEventListener('click', e => {
  const t = e.target.closest('[data-kategori]');
  if (!t) return;
  kategoriTerpilih = t.dataset.kategori;
  $$('#k-kategori .kategori').forEach(x => x.classList.toggle('aktif', x === t));
  gambarRak();
});
document.addEventListener('click', e => {
  const tambah = e.target.closest('[data-tambah]');
  const kurang = e.target.closest('[data-kurang]');
  const bagi = e.target.closest('[data-bagikan]');
  if (tambah) ubahPesanan(tambah.dataset.tambah, 1);
  if (kurang) ubahPesanan(kurang.dataset.kurang, -1);
  if (bagi) bagikanBarang(bagi.dataset.bagikan);
});
$('#k-bagikan-toko').onclick = bagikanToko;
$('#k-buka-pesanan').onclick = bukaPesanan;
$('#k-daftar').onclick = bukaPendaftaran;
$('#modal-tutup').onclick = tutupModal;
$('#latar-modal').addEventListener('click', e => { if (e.target.id === 'latar-modal') tutupModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupModal(); });

/* ---------- penyimpan luring: halaman tetap terbuka walau sinyal hilang ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
